<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research loop — designer's framing, research, designer's proposal, joint spec, repeated">
  <style>
    .box { fill: #ffffff; stroke: #2a2a2a; stroke-width: 1.5; }
    .accent { fill: #fff6e0; stroke: #2a2a2a; stroke-width: 1.5; }
    .arrow { stroke: #2a2a2a; stroke-width: 1.5; fill: none; }
    .title { fill: #1a1a1a; font: 600 12px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0.05em; }
    .sub { fill: #555; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    .center { fill: #888; font: italic 14px -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a2a2a"/>
    </marker>
  </defs>

  <rect class="box" x="280" y="20" width="240" height="90" rx="6"/>
  <text class="title" x="400" y="50" text-anchor="middle">DESIGNER'S INITIAL FRAMING</text>
  <text class="sub" x="400" y="74" text-anchor="middle">product-context view —</text>
  <text class="sub" x="400" y="92" text-anchor="middle">where the friction sits</text>

  <rect class="accent" x="540" y="190" width="240" height="100" rx="6"/>
  <text class="title" x="660" y="220" text-anchor="middle">RESEARCH</text>
  <text class="sub" x="660" y="244" text-anchor="middle">open-source DS source code,</text>
  <text class="sub" x="660" y="262" text-anchor="middle">Manychat product codebase,</text>
  <text class="sub" x="660" y="280" text-anchor="middle">DOM, RFCs, changelogs</text>

  <rect class="box" x="280" y="370" width="240" height="90" rx="6"/>
  <text class="title" x="400" y="400" text-anchor="middle">DESIGNER'S INFORMED PROPOSAL</text>
  <text class="sub" x="400" y="424" text-anchor="middle">grounded in product reality,</text>
  <text class="sub" x="400" y="442" text-anchor="middle">field knowledge, system constraints</text>

  <rect class="box" x="20" y="190" width="240" height="100" rx="6"/>
  <text class="title" x="140" y="220" text-anchor="middle">JOINT SPEC</text>
  <text class="sub" x="140" y="244" text-anchor="middle">co-authored: designer,</text>
  <text class="sub" x="140" y="262" text-anchor="middle">tech lead, developers</text>
  <text class="sub" x="140" y="280" text-anchor="middle">walk through it together</text>

  <path class="arrow" d="M 520 65 Q 660 65 660 186" marker-end="url(#arr2)"/>
  <path class="arrow" d="M 660 290 Q 660 415 524 415" marker-end="url(#arr2)"/>
  <path class="arrow" d="M 280 415 Q 140 415 140 294" marker-end="url(#arr2)"/>
  <path class="arrow" d="M 140 190 Q 140 65 276 65" marker-end="url(#arr2)"/>

  <text class="center" x="400" y="232" text-anchor="middle">repeated several</text>
  <text class="center" x="400" y="252" text-anchor="middle">dozen times across</text>
  <text class="center" x="400" y="272" text-anchor="middle">the engagement</text>
</svg>
