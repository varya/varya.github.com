<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compound component anatomy — Card as Root with Card.Head, Card.Body, Card.Divider, and Card.Tail sub-components, each with its dotted display name">
  <style>
    /* Ahua tokens — referenced by their conceptual names */

    /* color.global */
    .fill-card           { fill: #ffffff; }                       /* fill-background-white */
    .fill-slot           { fill: hsla(33, 12%, 96%, 1); }         /* grayscale-lightest / gray0 */
    .fill-slot-dim       { fill: hsla(33, 8%, 86%, 1); }          /* gray20 — placeholder fills */
    .fill-action-brand   { fill: hsla(212, 100%, 36%, 1); }        /* brand-dark / blue70 — Card.Action primary */
    .stroke-card         { stroke: hsla(0, 0%, 6%, 0.15); }        /* black15 — Card border */
    .stroke-divider      { stroke: hsla(0, 0%, 6%, 0.10); }        /* black10 — Card.Divider */
    .text-primary        { fill: hsla(0, 0%, 6%, 0.97); }          /* neutral-darkest */
    .text-secondary      { fill: hsla(0, 0%, 6%, 0.70); }          /* neutral-darker */
    .text-tertiary       { fill: hsla(0, 0%, 6%, 0.50); }          /* neutral-base */
    .text-on-brand       { fill: #ffffff; }                        /* inverse-darkest */
    .text-brand          { fill: hsla(212, 100%, 36%, 1); }        /* brand-dark */

    /* Type — sizes from Ahua scale (scale1 ≈ 11px, scale2 ≈ 13px, scale3 ≈ 14px, scale4 = 16px) */
    .root-label    { font: 600 16px 'NotoSans', system-ui, -apple-system, sans-serif; letter-spacing: 0.01em; }
    .root-sub      { font: italic 12px 'NotoSans', system-ui, -apple-system, sans-serif; }
    .section-label { font: 600 11px 'NotoSans', system-ui, -apple-system, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    .slot-label    { font: 600 11px 'NotoSans', system-ui, -apple-system, sans-serif; }
    .sub-label     { font: 11px 'NotoSans', system-ui, -apple-system, sans-serif; }
    .button-label  { font: 600 13px 'NotoSans', system-ui, -apple-system, sans-serif; }
    .caption       { font: italic 13px 'NotoSans', system-ui, -apple-system, sans-serif; }
    .mono          { font-family: ui-monospace, 'SFMono-Regular', monospace; }
  </style>

  <defs>
    <marker id="callout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="hsla(0,0%,6%,0.5)"/>
    </marker>
  </defs>

  <!-- Root: Card (border $black15, radius $m = 8) -->
  <rect class="fill-card stroke-card" x="40" y="40" width="720" height="480" rx="8" stroke-width="1"/>
  <text class="root-label text-primary" x="60" y="70">Card</text>
  <text class="root-sub text-tertiary" x="60" y="89">Root component — the export consumers import</text>

  <!-- ░░░ Card.Head ░░░ -->
  <text class="section-label text-tertiary" x="60" y="120">Card.Head</text>

  <!-- Avatar -->
  <circle class="fill-slot-dim" cx="120" cy="170" r="22"/>
  <text class="sub-label text-tertiary" x="120" y="206" text-anchor="middle">Avatar</text>

  <!-- Title and caption text-look -->
  <line x1="160" y1="158" x2="370" y2="158" stroke="hsla(0,0%,6%,0.7)" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="174" x2="310" y2="174" stroke="hsla(0,0%,6%,0.3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="186" x2="340" y2="186" stroke="hsla(0,0%,6%,0.3)" stroke-width="2" stroke-linecap="round"/>
  <text class="sub-label text-tertiary" x="265" y="206" text-anchor="middle">title · caption</text>

  <!-- Card.HeadActions slot (radius $s = 4) -->
  <rect class="fill-slot" x="555" y="148" width="165" height="48" rx="4"/>
  <text class="slot-label text-secondary" x="637" y="167" text-anchor="middle">Card.HeadActions</text>
  <!-- The actual Card.HeadAction (icon button-shaped tag) — labelled outside -->
  <rect class="fill-slot-dim" x="660" y="172" width="55" height="20" rx="4"/>

  <!-- Card.HeadAction callout (outside the slot) -->
  <text class="sub-label text-secondary" x="540" y="184" text-anchor="end" font-style="italic">Card.HeadAction</text>
  <path d="M 545 182 Q 595 182 655 182"
        stroke="hsla(0,0%,6%,0.5)" stroke-width="1" fill="none"
        marker-end="url(#callout-arrow)"/>

  <!-- ░░░ Card.Body ░░░ -->
  <text class="section-label text-tertiary" x="60" y="240">Card.Body</text>

  <!-- Card.Media slot -->
  <rect class="fill-slot" x="80" y="252" width="200" height="105" rx="4"/>
  <circle cx="135" cy="285" r="9" fill="none" stroke="hsla(0,0%,6%,0.3)" stroke-width="1.5"/>
  <path d="M 105 340 L 145 305 L 175 330 L 215 295 L 255 340 Z" fill="hsla(0,0%,6%,0.12)" stroke="none"/>
  <text class="slot-label text-secondary" x="180" y="378" text-anchor="middle">Card.Media</text>

  <!-- Card.Content slot -->
  <rect class="fill-slot" x="300" y="252" width="420" height="105" rx="4"/>
  <text class="slot-label text-secondary" x="315" y="272">Card.Content</text>
  <line x1="315" y1="290" x2="450" y2="290" stroke="hsla(0,0%,6%,0.3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="315" y1="307" x2="610" y2="307" stroke="hsla(0,0%,6%,0.7)" stroke-width="3" stroke-linecap="round"/>
  <line x1="315" y1="322" x2="560" y2="322" stroke="hsla(0,0%,6%,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="315" y1="337" x2="620" y2="337" stroke="hsla(0,0%,6%,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <text class="sub-label text-tertiary" x="510" y="378" text-anchor="middle">label · title · subtitle · description</text>

  <!-- Card.Divider (the actual sub-component, $black10) -->
  <line class="stroke-divider" x1="60" y1="402" x2="740" y2="402" stroke-width="1"/>
  <text class="sub-label text-tertiary" x="740" y="398" text-anchor="end">Card.Divider</text>

  <!-- ░░░ Card.Tail ░░░ -->
  <text class="section-label text-tertiary" x="60" y="430">Card.Tail</text>

  <!-- Card.Action variant="ghost" — text-only with brand colour, no fill -->
  <text class="button-label text-brand" x="300" y="495" text-anchor="middle">Card.Action <tspan class="mono">variant=&quot;ghost&quot;</tspan></text>

  <!-- Card.Action variant="primary" — filled brand-dark, white text, radius $s = 4 -->
  <rect class="fill-action-brand" x="440" y="470" width="290" height="40" rx="4"/>
  <text class="button-label text-on-brand" x="585" y="495" text-anchor="middle">Card.Action <tspan class="mono">variant=&quot;primary&quot;</tspan></text>

  <!-- Caption -->
  <text class="caption text-secondary" x="400" y="555" text-anchor="middle">Card as Root + slots — a real Ahua compound. <tspan class="mono">withDisplayNames()</tspan> sets each sub-component's</text>
  <text class="caption text-secondary" x="400" y="578" text-anchor="middle">runtime name to its dotted path, so Storybook code snippets render <tspan class="mono">&lt;Card.Head&gt;</tspan>, <tspan class="mono">&lt;Card.Body&gt;</tspan>, <tspan class="mono">&lt;Card.Action&gt;</tspan> faithfully.</text>
</svg>
